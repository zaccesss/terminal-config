# High-contrast starter config. Colours come from the High Contrast palette
# (palette/high-contrast.json). Alacritty cannot follow the system light and dark setting, so it
# imports the dark half; change the import to high-contrast-light.toml for a light window.

[general]
import = ["high-contrast-dark.toml"]

[window]
opacity = 1.0
padding = { x = 10, y = 10 }

[font]
size = 13.0

[font.normal]
family = "SF Mono"

[scrolling]
history = 10000
