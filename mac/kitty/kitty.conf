# High-contrast starter config. Colours come from the High Contrast palette
# (palette/high-contrast.json). Kitty 0.38 and later reads dark-theme.auto.conf and
# light-theme.auto.conf from this folder and swaps between them as the system switches between dark
# and light, so no colours are set here.

font_family      SF Mono
font_size        13.0

scrollback_lines 10000
background_opacity 1.0
